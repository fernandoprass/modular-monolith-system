services:
  postgres:
    image: postgres:17-alpine
    container_name: ${POSTGRES_SERVICE_NAME}
    restart: unless-stopped
    shm_size: '2gb'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    deploy:
      resources:
        limits:
          memory: 8gb
          cpus: '4.0'
    # Tuned for a host with ~16 GB RAM — adjust shared_buffers to 25% of RAM
    # and effective_cache_size to 75% of RAM if your host differs.
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=64MB
      -c maintenance_work_mem=512MB
      -c random_page_cost=1.1
      -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - modular-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_gui
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      # Desktop mode — disables the login page when running locally
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - ./servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - modular-network

networks:
  modular-network:
    external: true
    name: ${NETWORK_NAME}

volumes:
  postgres_data:
